spring.application.name=delulu-backend

# Loads local database settings when application-local.properties is present.
# This file is intentionally excluded from Git so credentials are never committed.
spring.config.import=optional:file:./application-local.properties

# Ollama
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3.2:3b

# PostgreSQL (values are supplied locally in application-local.properties)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Supabase JWT verification protects every API endpoint.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SUPABASE_ISSUER_URI:https://essoalgxvhnpwsvwjuno.supabase.co/auth/v1}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.ai.model.embedding=ollama
spring.ai.ollama.embedding.model=nomic-embed-text

# File upload limits
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
